[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdtagger"
version = "0.1.0"
description = "Open Source Metadata Manager for Franco-Belgian Comics, Manga and Comics"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "typer>=0.16",
    "rich>=14",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
[project.scripts]
bdtagger = "bdtagger.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true

